name: protocolo_z
description: "Protocolo Z - app de sobrevivência zumbi (Flutter + Supabase)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.3.2
  flutter_svg: ^2.3.0
  geolocator: ^14.1.2
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  image_picker: ^1.2.3
  intl: ^0.20.2
  latlong2: ^0.10.1
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/factions/
